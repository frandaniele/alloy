name: Test custom builds
on:
  pull_request:
    paths:
      - 'collector/**'
      - 'internal/component/all/**'
      - 'internal/converter/install/**'
      - 'extension/alloyengine/**'
      - 'Makefile'
      - '.github/workflows/test-custom-builds.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_custom_builds:
    name: Build custom Alloy binaries
    runs-on: github-hosted-ubuntu-x64-large
    container: grafana/alloy-build-image:v0.1.37@sha256:716ebb596222e7d046384e7bcc908ad8db8e1eaf5efb89bef3183d8c9fdf6c54
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: Set ownership
      # https://github.com/actions/runner/issues/2033#issuecomment-1204205989
      run: |
          # this is to fix GIT not liking owner of the checkout dir
          chown -R $(id -u):$(id -g) $PWD
    - name: Build and check custom binaries
      run: make test-custom-builds
